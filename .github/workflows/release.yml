# Build the Mac binaries (styr, styrd) for a version tag and attach them to its
# GitHub release. The Homebrew formula (christoffermattssonlangseth/homebrew-styrman)
# points at these assets; update its url/sha256 after a release
# (packaging/update-formula.sh does that).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-15   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked -p styrd -p styr
      - name: Test
        run: cargo test --release --locked --workspace
      - name: Package
        run: |
          v="${GITHUB_REF_NAME#v}"
          name="styrman-$v-aarch64-apple-darwin"
          mkdir "$name"
          cp target/release/styr target/release/styrd README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Styrman $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" styrman-*.tar.gz styrman-*.tar.gz.sha256 --clobber
