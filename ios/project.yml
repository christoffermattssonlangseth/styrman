# Generate Styrman.xcodeproj with:  cd ios && xcodegen
name: Styrman
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Team and bundle id come from Signing.xcconfig (override in Signing.local.xcconfig).
    DEVELOPMENT_TEAM: $(STYRMAN_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Styrman:
    type: application
    platform: iOS
    sources:
      - path: Styrman
      - path: Shared
    dependencies:
      - target: StyrmanNotify
      - target: StyrmanWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STYRMAN_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Styrman/Styrman.entitlements
        # APNs environment the app reports to styrd: development builds use the sandbox.
      configs:
        Debug:
          STYRMAN_APNS_ENV: sandbox
          STYRMAN_APS_ENVIRONMENT: development
        # TestFlight / App Store builds get push through Apple's production servers.
        Release:
          STYRMAN_APNS_ENV: production
          STYRMAN_APS_ENVIRONMENT: production
    info:
      path: Styrman/Info.plist
      properties:
        CFBundleDisplayName: Styrman
        StyrmanAPNsEnvironment: $(STYRMAN_APNS_ENV)
        StyrmanAppGroup: group.$(STYRMAN_BUNDLE_ID)
        NSSupportsLiveActivities: true
        StyrmanAppBundleID: $(STYRMAN_BUNDLE_ID)
        StyrmanKeychainGroup: $(AppIdentifierPrefix)$(STYRMAN_BUNDLE_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Scan the pairing QR code shown by `styr pair` on your Mac.
        NSMicrophoneUsageDescription: Dictate messages to your coding agents.
        NSSpeechRecognitionUsageDescription: Turn what you say into text for your message. Recognition stays on this iPhone when it supports that.
        NSLocalNetworkUsageDescription: Styrman connects to the styrd daemon on your Mac.
        # styrd is reached over Tailscale by its MagicDNS name (*.ts.net); the tunnel is
        # WireGuard-encrypted, so plain ws:// is allowed for ts.net only (plus loopback
        # for the simulator). Everything else keeps ATS's TLS requirement.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: $(STYRMAN_BUNDLE_ID).pair
            CFBundleURLSchemes: [styrman]
  # Adds the actual command and Allow/Deny to approval notifications, fetched from
  # the Mac over the tailnet (the push itself carries no command).
  StyrmanNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: StyrmanNotify
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STYRMAN_BUNDLE_ID).notify
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: StyrmanNotify/StyrmanNotify.entitlements
    info:
      path: StyrmanNotify/Info.plist
      properties:
        CFBundleDisplayName: Styrman
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        StyrmanAppGroup: group.$(STYRMAN_BUNDLE_ID)
        StyrmanAppBundleID: $(STYRMAN_BUNDLE_ID)
        StyrmanKeychainGroup: $(AppIdentifierPrefix)$(STYRMAN_BUNDLE_ID)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  # The Live Activity (Lock Screen + Dynamic Island) and the Agents widget.
  StyrmanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: StyrmanWidgets
      - path: Shared/LiveActivity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STYRMAN_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: StyrmanWidgets/StyrmanWidgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    info:
      path: StyrmanWidgets/Info.plist
      properties:
        CFBundleDisplayName: Styrman
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        StyrmanAppGroup: group.$(STYRMAN_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  StyrmanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StyrmanTests
    dependencies:
      - target: Styrman
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(STYRMAN_BUNDLE_ID).tests
schemes:
  Styrman:
    build:
      targets:
        Styrman: all
        StyrmanTests: [test]
    test:
      targets: [StyrmanTests]
